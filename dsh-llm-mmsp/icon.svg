<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MMSP protocol adapter">
  <defs>
    <linearGradient id="mmsp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3a5f"/>
      <stop offset="1" stop-color="#0d1f36"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#mmsp-bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#4f8fd6" stroke-width="1.5" opacity="0.55"/>
  <!-- left: harness side (structured blocks) -->
  <rect x="11" y="17" width="15" height="6" rx="2" fill="#8ec5ff"/>
  <rect x="11" y="29" width="15" height="6" rx="2" fill="#4f8fd6"/>
  <rect x="11" y="41" width="9" height="6" rx="2" fill="#2f6099"/>
  <!-- right: MMSP side (streamed frames) -->
  <rect x="38" y="15" width="15" height="4" rx="2" fill="#8ec5ff"/>
  <rect x="38" y="23" width="15" height="4" rx="2" fill="#8ec5ff"/>
  <rect x="38" y="31" width="11" height="4" rx="2" fill="#4f8fd6"/>
  <rect x="38" y="39" width="15" height="4" rx="2" fill="#4f8fd6"/>
  <rect x="38" y="47" width="7" height="4" rx="2" fill="#2f6099"/>
  <!-- conversion arrows -->
  <path d="M29 30 h5" stroke="#d9ecff" stroke-width="2" stroke-linecap="round"/>
  <path d="M31.5 27.5 L34.5 30 L31.5 32.5" fill="none" stroke="#d9ecff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M35 36 h-5" stroke="#d9ecff" stroke-width="2" stroke-linecap="round"/>
  <path d="M32.5 33.5 L29.5 36 L32.5 38.5" fill="none" stroke="#d9ecff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
